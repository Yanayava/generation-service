<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Схемы сервиса генерации</title>
  <style>
    body {
      margin: 0 auto;
      max-width: 1100px;
      padding: 32px 20px 64px;
      font-family: "Segoe UI", sans-serif;
      color: #1a1a1a;
      background: #fff;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 600;
    }
    p {
      margin: 0 0 28px;
      font-size: 16px;
      line-height: 1.45;
    }
    h2 {
      margin: 36px 0 12px;
      font-size: 20px;
      font-weight: 600;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Сервис генерации</h1>
  <p>Пять шагов задачи, одно решение по отказу и три движения денег. Каждое движение — одна строка журнала.</p>

  <h2>Жизненный цикл задачи</h2>
  <img src="lifecycle.png" alt="Схема: заказ, проверка ноги, списание, отправка провайдеру и одно решение по отказу">

  <h2>Движение денег</h2>
  <img src="money.png" alt="Схема: оплата, списание и возврат сходятся в баланс, поздний успех остаётся в истории">
</body>
</html>
